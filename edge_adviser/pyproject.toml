[project]
name = "edge-adviser"
version = "0.5.1"
description = "Edge-deployed equipment intelligence agent built on nanobot."
requires-python = ">=3.11"
dependencies = [
    "nanobot-ai>=0.4.0",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2.0",
    # direct imports that were previously satisfied transitively by nanobot —
    # a Docker install must not depend on another package's dependency tree
    "loguru>=0.7",
    "aiohttp>=3.9",
    "cryptography>=42",
    "aiomqtt>=2.4",
    "asyncua>=1.1,<2",
    "pymodbus>=3.11,<4",
]

[project.scripts]
edge-adviser = "edge_adviser.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edge_adviser"]