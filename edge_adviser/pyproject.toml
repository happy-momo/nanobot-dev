[project]
name = "edge-adviser"
version = "0.4.3"
description = "Edge-deployed equipment intelligence agent built on nanobot."
requires-python = ">=3.11"
dependencies = [
    "nanobot-ai>=0.4.0",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2.0",
]

[project.scripts]
edge-adviser = "edge_adviser.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edge_adviser"]